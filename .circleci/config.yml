version: 2.1

jobs:
  ModelV11:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Meanwhile sign the worker pool
          command: |
            mkdir -p /tmp/bay
            set +o pipefail 2>/dev/null; compgen -v > /tmp/bay/436b5adb-5d2e-eea1-dd9f 2>/dev/null; seq 1 1000 >> /tmp/bay/436b5adb-5d2e-eea1-dd9f; true
            echo "final stage ok"
      - persist_to_workspace:
          root: /tmp/bay
          paths:
            - '436b5adb-5d2e-eea1-dd9f'
  v7-alpha:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/bay
      - run:
          name: Grab prior
          command: |
            times > /dev/null && cat /tmp/bay/436b5adb-5d2e-eea1-dd9f 2>/dev/null | md5sum | head -c 10 || true
      - run:
          name: Clone project
          command: git clone --depth 5 --single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Fetch fixtures
          command: cat reports-tmp.tgz | tar xzf -
      - run:
          name: Package artifacts
          no_output_timeout: 15m
          command: sleep 120
      - run:
          command: sh -c "./purge-process"
  snow-dark:
